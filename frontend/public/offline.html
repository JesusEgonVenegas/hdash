<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDASH — offline</title>
<!-- Served by sw.js when a page load fails. Self-contained on purpose: with no
     connection, nothing else (JS chunks, CSS, fonts) can be fetched. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a0a0a; color: #d4d4d4; font: 14px/1.6 ui-monospace, "Geist Mono", Menlo, Consolas, monospace; padding: 16px; box-sizing: border-box; }
  .box { border: 1px solid rgba(202,138,4,.4); background: rgba(234,179,8,.05); padding: 32px; max-width: 420px; width: 100%; text-align: center; }
  .tag { color: #facc15; font-size: 13px; }
  h1 { font-size: 18px; font-weight: normal; margin: 12px 0; }
  p { color: #737373; margin: 0 0 20px; }
  button { font: inherit; color: #facc15; background: none; border: 1px solid rgba(202,138,4,.5); padding: 8px 24px; cursor: pointer; }
  button:hover { background: rgba(250,204,21,.1); }
</style>
</head>
<body>
  <div class="box">
    <div class="tag">[OFFLINE]</div>
    <h1>&gt; no connection</h1>
    <p>HDASH needs to reach your server to load the household. Check your connection, or that the server is running, and try again.</p>
    <button onclick="location.reload()">[ retry ]</button>
  </div>
</body>
</html>
